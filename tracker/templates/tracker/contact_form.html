{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Add Contact{% endblock %}

{% block content %}
<h2 class="mb-4">Add Contact — {{ company.name }}</h2>

<div class="card card-stat p-4" style="max-width: 560px;">
    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-primary mt-2">Save</button>
        <a href="{% url 'company_detail' company.pk %}" class="btn btn-link">Cancel</a>
    </form>
</div>
{% endblock %}
